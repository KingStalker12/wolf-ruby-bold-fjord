<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Cinzel Deco";
      src: url("fonts/CinzelDeco-900.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Cinzel";
      src: url("fonts/Cinzel-700.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 264px;
      overflow: hidden;
      background: #0a0a0b;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 264px;
      background:
        radial-gradient(ellipse 38% 90% at 78% 58%, rgba(181, 74, 60, 0.2) 0%, transparent 70%),
        radial-gradient(ellipse 50% 90% at 18% 40%, rgba(181, 74, 60, 0.1) 0%, transparent 70%),
        linear-gradient(90deg, #0a0a0b 0%, #121214 42%, #0a0a0b 100%);
      overflow: hidden;
    }
    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      pointer-events: none;
      mix-blend-mode: overlay;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10,10,11,0.12) 0%, transparent 28%, rgba(10,10,11,0.5) 100%),
        linear-gradient(180deg, transparent 72%, #0a0a0b 100%);
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 56px;
      top: 38px;
      width: 520px;
    }
    .ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .ornament .rule {
      width: 56px;
      height: 1px;
      background: linear-gradient(90deg, #b54a3c, transparent);
    }
    .ornament .pip {
      width: 6px;
      height: 6px;
      background: #b54a3c;
      transform: rotate(45deg);
    }
    h1 {
      font-family: "Cinzel Deco", "Cinzel", serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 0.14em;
      color: #f0eee8;
      line-height: 1;
      text-indent: 0.14em;
      text-shadow: 0 2px 0 rgba(10,10,11,0.85), 0 10px 24px rgba(10,10,11,0.6);
    }
    .tag {
      margin-top: 12px;
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: #8a8780;
    }
    .well {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="noise" xmlns="http://www.w3.org/2000/svg" width="1200" height="264">
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
    <svg class="well" viewBox="0 0 1200 264" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="shaft" cx="75%" cy="70%" r="40%">
          <stop offset="0%" stop-color="#b54a3c" stop-opacity="0.32"/>
          <stop offset="55%" stop-color="#0a0a0b" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="700" y="0" width="500" height="264" fill="url(#shaft)"/>
      <!-- well mouth on the right -->
      <path d="M708 264 V96 C708 32 800 6 900 6 C1000 6 1092 32 1092 96 V264"
            fill="none" stroke="#f0eee8" stroke-width="2.3" opacity="0.62"/>
      <path d="M738 264 V104 C738 44 816 20 900 20 C984 20 1062 44 1062 104 V264"
            fill="none" stroke="#c8ccd4" stroke-width="1.2" opacity="0.4"/>
      <path d="M778 264 V120 C778 62 832 40 900 40 C968 40 1022 62 1022 120 V264"
            fill="none" stroke="#7a8b99" stroke-width="1.1" opacity="0.42"/>
      <ellipse cx="900" cy="158" rx="96" ry="30" fill="#0a0a0b" opacity="0.7"/>
      <ellipse cx="900" cy="158" rx="96" ry="30" fill="none" stroke="#f0eee8" stroke-width="1.8" opacity="0.5"/>
      <ellipse cx="900" cy="158" rx="62" ry="18" fill="#b54a3c" opacity="0.2"/>
      <ellipse cx="900" cy="158" rx="28" ry="8" fill="#0a0a0b" opacity="0.85"/>
      <path d="M900 2 L908 16 L900 30 L892 16 Z" fill="#b54a3c"/>
    </svg>
    <div class="lockup">
      <div class="ornament">
        <span class="pip"></span>
        <span class="rule"></span>
      </div>
      <h1>SEPULCHER</h1>
      <div class="tag">ASH AND BONE</div>
    </div>
    <div class="vignette"></div>
  </div>
</body>
</html>
