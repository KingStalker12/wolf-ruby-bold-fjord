<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Cinzel Deco";
      src: url("fonts/CinzelDeco-900.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
    }
    @font-face {
      font-family: "Cinzel";
      src: url("fonts/Cinzel-700.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0a0a0b;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 42% 38% at 50% 72%, rgba(181, 74, 60, 0.22) 0%, transparent 70%),
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(18, 18, 20, 0.95) 0%, transparent 55%),
        linear-gradient(180deg, #121214 0%, #0a0a0b 46%, #0a0a0b 100%);
      overflow: hidden;
    }
    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      pointer-events: none;
      mix-blend-mode: overlay;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 72% 68% at 50% 48%, transparent 38%, #0a0a0b 100%);
      pointer-events: none;
    }
    .frame {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(200, 204, 212, 0.18);
      pointer-events: none;
    }
    .frame::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(181, 74, 60, 0.28);
    }
    .well {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -54%);
      text-align: center;
      width: 820px;
    }
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .ornament .rule {
      width: 92px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #b54a3c 30%, #b54a3c 70%, transparent);
    }
    .ornament .pip {
      width: 8px;
      height: 8px;
      background: #b54a3c;
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(181, 74, 60, 0.7);
    }
    h1 {
      font-family: "Cinzel Deco", "Cinzel", serif;
      font-weight: 900;
      font-size: 86px;
      letter-spacing: 0.15em;
      color: #f0eee8;
      line-height: 1;
      text-indent: 0.15em;
      text-shadow:
        0 2px 0 rgba(10, 10, 11, 0.85),
        0 18px 40px rgba(10, 10, 11, 0.7),
        0 0 42px rgba(181, 74, 60, 0.18);
    }
    .tag {
      margin-top: 20px;
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.46em;
      text-indent: 0.46em;
      color: #8a8780;
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg class="noise" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
    <svg class="well" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="shaft" cx="50%" cy="78%" r="58%">
          <stop offset="0%" stop-color="#b54a3c" stop-opacity="0.38"/>
          <stop offset="28%" stop-color="#1a1a1e" stop-opacity="0.88"/>
          <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f0eee8" stop-opacity="0.92"/>
          <stop offset="100%" stop-color="#c8ccd4" stop-opacity="0.28"/>
        </linearGradient>
      </defs>
      <!-- well shaft -->
      <path d="M372 630 V248 C372 118 468 68 600 68 C732 68 828 118 828 248 V630" fill="url(#shaft)"/>
      <!-- outer well mouth -->
      <path d="M328 630 V236 C328 96 448 36 600 36 C752 36 872 96 872 236 V630"
            fill="none" stroke="url(#bone)" stroke-width="3.6"/>
      <!-- mid ring -->
      <path d="M378 630 V252 C378 122 476 76 600 76 C724 76 822 122 822 252 V630"
            fill="none" stroke="#c8ccd4" stroke-width="1.35" opacity="0.52"/>
      <!-- inner ring -->
      <path d="M444 630 V292 C444 168 512 116 600 116 C688 116 756 168 756 292 V630"
            fill="none" stroke="#7a8b99" stroke-width="1.2" opacity="0.48"/>
      <!-- looking down the mouth -->
      <ellipse cx="600" cy="468" rx="156" ry="44" fill="#0a0a0b" opacity="0.72"/>
      <ellipse cx="600" cy="468" rx="156" ry="44" fill="none" stroke="#f0eee8" stroke-width="2.2" opacity="0.55"/>
      <ellipse cx="600" cy="468" rx="124" ry="34" fill="none" stroke="#c8ccd4" stroke-width="1.1" opacity="0.4"/>
      <ellipse cx="600" cy="468" rx="78" ry="20" fill="#b54a3c" opacity="0.22"/>
      <ellipse cx="600" cy="468" rx="36" ry="9" fill="#0a0a0b" opacity="0.85"/>
      <!-- keystone -->
      <path d="M600 22 L618 48 L600 74 L582 48 Z" fill="#b54a3c"/>
      <path d="M600 30 L610 48 L600 66 L590 48 Z" fill="#f0eee8" opacity="0.92"/>
      <!-- ash motes -->
      <g fill="#c8ccd4" opacity="0.22">
        <circle cx="214" cy="168" r="1.4"/>
        <circle cx="980" cy="210" r="1.1"/>
        <circle cx="190" cy="420" r="1.2"/>
        <circle cx="1024" cy="390" r="1.3"/>
        <circle cx="260" cy="520" r="0.9"/>
        <circle cx="940" cy="540" r="1.0"/>
        <circle cx="430" cy="140" r="1.0"/>
        <circle cx="770" cy="128" r="0.8"/>
      </g>
    </svg>
    <div class="lockup">
      <div class="ornament">
        <span class="rule"></span>
        <span class="pip"></span>
        <span class="rule"></span>
      </div>
      <h1>SEPULCHER</h1>
      <div class="tag">ASH AND BONE</div>
    </div>
    <div class="vignette"></div>
    <div class="frame"></div>
  </div>
</body>
</html>
